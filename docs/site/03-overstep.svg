<svg viewBox="0 0 880 470" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="a4" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="470" fill="#fafafa"/>
  <text x="440" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">越界处置 · 判据是「可逆 / 撤不回」</text>
  <text x="440" y="60" text-anchor="middle" font-size="13" fill="#64748b">没有「默默越界」这个选项 —— 两条路都通向暴露</text>

  <!-- top: trigger -->
  <rect x="320" y="84" width="240" height="56" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.8"/>
  <text x="440" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#c2410c">Agent 评估发现：</text>
  <text x="440" y="128" text-anchor="middle" font-size="12.5" fill="#7c2d12">要实现，得碰范围外的东西</text>

  <!-- decision -->
  <polygon points="440,164 580,212 440,260 300,212" fill="#f1f5f9" stroke="#334155" stroke-width="1.8"/>
  <text x="440" y="206" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">它撤得回吗？</text>
  <text x="440" y="226" text-anchor="middle" font-size="11" fill="#64748b">（不看风险主观判断，看能否撤）</text>

  <line x1="440" y1="140" x2="440" y2="164" stroke="#475569" stroke-width="1.5" marker-end="url(#a4)"/>

  <!-- left branch: reversible -->
  <path d="M300 212 L 180 212 L 180 290" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#a4)"/>
  <text x="240" y="202" font-size="12" font-weight="700" fill="#16a34a">可逆 · 局部小事</text>

  <rect x="40" y="292" width="280" height="150" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="180" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">允许做，但必须显式声明</text>
  <text x="60" y="346" font-size="12" fill="#14532d">• 在看板标明：我越出原范围</text>
  <text x="60" y="370" font-size="12" fill="#14532d">• 动了什么、为什么</text>
  <text x="60" y="394" font-size="12" fill="#14532d">• 不值当为小事打断</text>
  <text x="60" y="422" font-size="11.5" font-weight="600" fill="#15803d">兜底：就算不声明，</text>
  <text x="60" y="440" font-size="11.5" font-weight="600" fill="#15803d">diff 比对照样露馅</text>

  <!-- right branch: irreversible -->
  <path d="M580 212 L 700 212 L 700 290" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#a4)"/>
  <text x="650" y="202" font-size="12" font-weight="700" fill="#dc2626">撤不回 · 全局大事</text>

  <rect x="560" y="292" width="280" height="150" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="700" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">撞线必停，退回人确认</text>
  <text x="580" y="346" font-size="12" fill="#7f1d1d">• 公共契约 / 别人依赖的核心</text>
  <text x="580" y="370" font-size="12" fill="#7f1d1d">• 数据结构 / 跨模块一致性</text>
  <text x="580" y="394" font-size="12" fill="#7f1d1d">• 人裁决：重焊范围 or 驳回</text>
  <text x="580" y="422" font-size="11.5" font-weight="600" fill="#b91c1c">兜底：碰这类东西即触发停，</text>
  <text x="580" y="440" font-size="11.5" font-weight="600" fill="#b91c1c">由流程拦，不靠它自觉</text>

  <text x="440" y="462" text-anchor="middle" font-size="11.5" fill="#94a3b8" font-style="italic">两道防线都不靠 Agent 的良心：前面流程拦，后面 diff 抓</text>
</svg>
