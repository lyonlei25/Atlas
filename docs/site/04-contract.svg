<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="a5" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="540" fill="#fafafa"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">模块解耦 · 用契约让模块独立开发</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#64748b">业务不碰基础内部，只对接口编程；契约住看板，不住会蒸发的对话</text>

  <!-- business agent -->
  <rect x="40" y="92" width="270" height="150" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="175" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#c2410c">业务 Agent</text>
  <text x="60" y="146" font-size="12" fill="#7c2d12">• 不直接改基础模块内部</text>
  <text x="60" y="170" font-size="12" fill="#7c2d12">• 对着「接口」编程</text>
  <text x="60" y="194" font-size="12" fill="#7c2d12">• 先用占位符顶替</text>
  <text x="60" y="222" font-size="12" font-weight="600" fill="#9a3412">module/agents.md（本模块约定）</text>

  <!-- base agent -->
  <rect x="650" y="92" width="270" height="150" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
  <text x="785" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#7e22ce">基础模块 Agent</text>
  <text x="670" y="146" font-size="12" fill="#581c87">• 接口背后自己实现</text>
  <text x="670" y="170" font-size="12" fill="#581c87">• 不能单方面改契约</text>
  <text x="670" y="194" font-size="12" fill="#581c87">• 要改 → 撞线停，退回重约</text>
  <text x="670" y="222" font-size="12" font-weight="600" fill="#6b21a8">module/agents.md（固化的契约）</text>

  <!-- contract in board (center) -->
  <rect x="350" y="100" width="260" height="200" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
  <text x="480" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">接口契约（住在看板）</text>
  <rect x="368" y="138" width="224" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="480" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">= 可执行的契约测试</text>
  <text x="480" y="180" text-anchor="middle" font-size="11" fill="#1e3a8a">不是纯文字描述</text>
  <text x="480" y="197" text-anchor="middle" font-size="11" fill="#1e3a8a">输入/输出 + 怎么算实现对</text>

  <rect x="368" y="216" width="224" height="70" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="238" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">独立于任何 session</text>
  <text x="480" y="258" text-anchor="middle" font-size="11" fill="#475569">谁都改不动</text>
  <text x="480" y="275" text-anchor="middle" font-size="11" fill="#475569">下个新 session 也能读到</text>

  <!-- arrows: both agree to contract -->
  <line x1="310" y1="155" x2="348" y2="165" stroke="#475569" stroke-width="1.8" marker-end="url(#a5)"/>
  <text x="320" y="148" font-size="10.5" fill="#64748b">读/依赖</text>
  <line x1="650" y1="165" x2="612" y2="170" stroke="#475569" stroke-width="1.8" marker-end="url(#a5)"/>
  <text x="618" y="148" font-size="10.5" fill="#64748b">实现</text>

  <!-- replace trigger flow (bottom) -->
  <text x="480" y="340" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">占位符替换 · 扳机挂在「事实」上，不挂在「通知」上</text>

  <rect x="60" y="364" width="200" height="120" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="160" y="388" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">✗ 错误做法</text>
  <text x="80" y="414" font-size="11.5" fill="#7f1d1d">基础 Agent 说「我做好了」</text>
  <text x="80" y="436" font-size="11.5" fill="#7f1d1d">业务 Agent 盲目替换</text>
  <text x="80" y="462" font-size="11.5" font-weight="600" fill="#b91c1c">→ 黑盒自陈，接口对不上</text>
  <text x="80" y="478" font-size="11.5" font-weight="600" fill="#b91c1c">　 当场就坏，还很隐蔽</text>

  <line x1="270" y1="424" x2="330" y2="424" stroke="#475569" stroke-width="2" marker-end="url(#a5)"/>

  <rect x="340" y="364" width="560" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="620" y="388" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">✓ 正确做法：事实驱动替换</text>
  <text x="360" y="416" font-size="12" fill="#14532d">① 基础模块实现完 → 跑契约自带的测试</text>
  <text x="360" y="440" font-size="12" fill="#14532d">② 测试通过 → 看板状态自动翻「契约已兑现」（事实）</text>
  <text x="360" y="464" font-size="12" fill="#14532d">③ 业务 Agent 看到这个事实状态 → 才替换占位符</text>
  <text x="620" y="480" text-anchor="middle" font-size="11" font-style="italic" fill="#15803d">业务换上去的，是被验证过确实符合契约的，不是嘴上保证的</text>
</svg>
