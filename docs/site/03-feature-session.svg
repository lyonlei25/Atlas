<svg viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="560" fill="#fafafa"/>
  <text x="490" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">L3 Feature Session · 全程用事实审，不靠自陈</text>

  <!-- lanes -->
  <text x="150" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#c2410c">Agent（做事 + 交原材料）</text>
  <text x="490" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">看板 / 机器（审，事实驱动）</text>
  <text x="830" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">人（守全局，处理撞线）</text>

  <line x1="150" y1="88" x2="150" y2="530" stroke="#fdba74" stroke-width="2"/>
  <line x1="490" y1="88" x2="490" y2="530" stroke="#86efac" stroke-width="2"/>
  <line x1="830" y1="88" x2="830" y2="530" stroke="#93c5fd" stroke-width="2"/>

  <!-- step 1 register /立锚 -->
  <rect x="40" y="100" width="220" height="48" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="150" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#7c2d12">① 注册：声明范围+验收</text>
  <text x="150" y="138" text-anchor="middle" font-size="11" fill="#9a3412">（接受上层焊死的硬锚）</text>
  <line x1="260" y1="124" x2="488" y2="124" stroke="#475569" stroke-width="1.5" marker-end="url(#a3)"/>
  <rect x="395" y="100" width="190" height="48" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="490" y="120" text-anchor="middle" font-size="11.5" fill="#14532d">登记基准线（锚）</text>
  <text x="490" y="138" text-anchor="middle" font-size="11" fill="#3f6212">后续比对的参照</text>

  <!-- step 2 evaluate impl -->
  <rect x="40" y="164" width="220" height="46" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="150" y="184" text-anchor="middle" font-size="12" font-weight="600" fill="#7c2d12">② 评估执行细节（自由）</text>
  <text x="150" y="201" text-anchor="middle" font-size="11" fill="#9a3412">怎么实现，归 Agent</text>

  <!-- decision: crosses the line? -->
  <polygon points="150,228 250,266 150,304 50,266" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="150" y="262" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b91c1c">评估结论要</text>
  <text x="150" y="278" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b91c1c">捅破范围吗？</text>

  <!-- branch to human if irreversible -->
  <path d="M250 266 L 828 266" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a3)"/>
  <text x="540" y="258" font-size="11" font-weight="600" fill="#b91c1c">撞「撤不回」的线 → 停</text>
  <rect x="725" y="244" width="200" height="46" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="825" y="264" text-anchor="middle" font-size="11.5" fill="#1e40af">人裁决：</text>
  <text x="825" y="281" text-anchor="middle" font-size="11" fill="#1e3a8a">改范围重焊 / 驳回</text>

  <!-- no -> continue -->
  <line x1="150" y1="304" x2="150" y2="330" stroke="#475569" stroke-width="1.5" marker-end="url(#a3)"/>
  <text x="195" y="322" font-size="10.5" fill="#64748b">否/可逆</text>

  <!-- step 3 do work -->
  <rect x="40" y="332" width="220" height="46" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="150" y="352" text-anchor="middle" font-size="12" font-weight="600" fill="#7c2d12">③ 干活</text>
  <text x="150" y="369" text-anchor="middle" font-size="11" fill="#9a3412">越界碰可逆 → 必须显式声明</text>

  <!-- step 4 submit diff -->
  <rect x="40" y="392" width="220" height="46" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="150" y="412" text-anchor="middle" font-size="12" font-weight="600" fill="#7c2d12">④ 交实际 diff（原样）</text>
  <text x="150" y="429" text-anchor="middle" font-size="11" fill="#9a3412">骗不了的事实</text>
  <line x1="260" y1="415" x2="488" y2="415" stroke="#475569" stroke-width="1.5" marker-end="url(#a3)"/>

  <!-- step 5 board compares -->
  <rect x="370" y="392" width="240" height="74" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="490" y="412" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803d">⑤ 机械比对（不让 Agent 自审）</text>
  <text x="490" y="431" text-anchor="middle" font-size="10.5" fill="#14532d">声称 vs 实际 → 抓「藏起来的越界」</text>
  <text x="490" y="448" text-anchor="middle" font-size="10.5" fill="#14532d">承诺 vs 实际 → 抓「范围蔓延」</text>
  <text x="490" y="463" text-anchor="middle" font-size="10.5" fill="#14532d">对不上 → 标红，提醒人看</text>

  <!-- step 6 status by test -->
  <rect x="370" y="480" width="240" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="490" y="500" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d4ed8">⑥ 状态翻牌 = 测试/CI 通过</text>
  <text x="490" y="517" text-anchor="middle" font-size="10.5" fill="#1e3a8a">不是 Agent 说「完成」就翻</text>

  <!-- red flag to human -->
  <path d="M610 429 L 828 380" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a3)"/>
  <rect x="725" y="356" width="200" height="46" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="825" y="376" text-anchor="middle" font-size="11" fill="#1e40af">人重点审标红处</text>
  <text x="825" y="393" text-anchor="middle" font-size="10.5" fill="#1e3a8a">注意力压在爆炸半径大处</text>

  <text x="150" y="468" text-anchor="middle" font-size="10.5" fill="#94a3b8" font-style="italic">Agent 只做两件没法造假的事：</text>
  <text x="150" y="484" text-anchor="middle" font-size="10.5" fill="#94a3b8" font-style="italic">立锚 + 交 diff</text>
  <text x="150" y="500" text-anchor="middle" font-size="10.5" fill="#94a3b8" font-style="italic">所有「判断」都在它外面</text>
</svg>
